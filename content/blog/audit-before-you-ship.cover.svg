    <circle cx="860" cy="385" r="15" fill="#6fe88a" fill-opacity="0.15" stroke="#6fe88a" stroke-width="3"/>
    <path d="M853 385 L858 390 L868 379" fill="none" stroke="#6fe88a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="379" width="120" height="12" rx="6" fill="#3f3f46"/>

    <circle cx="860" cy="445" r="15" fill="none" stroke="#ff5c9d" stroke-width="3"/>
    <rect x="890" y="439" width="140" height="12" rx="6" fill="#3f3f46"/>
  </g>

  <!-- Connectors -->
  <path d="M392 330 H418" stroke="#52525b" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <path d="M782 330 H812" stroke="#52525b" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
