  <!-- Pre-launch checklist, right -->
  <rect x="820" y="150" width="270" height="330" rx="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
  <g>
    <circle cx="860" cy="205" r="15" fill="#6fe88a" fill-opacity="0.15" stroke="#6fe88a" stroke-width="3"/>
    <path d="M853 205 L858 210 L868 199" fill="none" stroke="#6fe88a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="199" width="160" height="12" rx="6" fill="#3f3f46"/>

    <circle cx="860" cy="265" r="15" fill="#6fe88a" fill-opacity="0.15" stroke="#6fe88a" stroke-width="3"/>
    <path d="M853 265 L858 270 L868 259" fill="none" stroke="#6fe88a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="259" width="130" height="12" rx="6" fill="#3f3f46"/>

    <circle cx="860" cy="325" r="15" fill="#6fe88a" fill-opacity="0.15" stroke="#6fe88a" stroke-width="3"/>
    <path d="M853 325 L858 330 L868 319" fill="none" stroke="#6fe88a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
