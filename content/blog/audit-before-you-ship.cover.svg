  </defs>

  <!-- Terms & privacy documents, left -->
  <g transform="translate(-50 0) rotate(-9 270 330)">
    <rect x="150" y="170" width="240" height="310" rx="18" fill="#141418" stroke="#3f3f46" stroke-width="2"/>
    <rect x="180" y="205" width="110" height="14" rx="7" fill="#52525b"/>
    <rect x="180" y="245" width="180" height="10" rx="5" fill="#3f3f46"/>
    <rect x="180" y="270" width="160" height="10" rx="5" fill="#3f3f46"/>
    <rect x="180" y="295" width="175" height="10" rx="5" fill="#3f3f46"/>
  </g>
  <g transform="translate(-50 0) rotate(5 300 330)">
    <rect x="185" y="160" width="240" height="320" rx="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
    <rect x="215" y="195" width="120" height="16" rx="8" fill="#5fd4f0"/>
    <rect x="215" y="240" width="180" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="265" width="150" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="290" width="170" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="315" width="120" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="355" width="180" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="380" width="140" height="10" rx="5" fill="#3f3f46"/>
    <rect x="215" y="420" width="70" height="26" rx="13" fill="none" stroke="#a77bff" stroke-width="2"/>
  </g>

  <!-- Shield, centre -->
  <path d="M600 120 L775 185 V315 C775 425 700 490 600 525 C500 490 425 425 425 315 V185 Z"
        fill="url(#shieldFill)" stroke="url(#shield)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M600 165 L735 215 V318 C735 405 678 456 600 485 C522 456 465 405 465 318 V215 Z"
